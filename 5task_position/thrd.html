<!DOCTYPE html> 
<html lang="ru"> 
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <style> 
        body { 
            font-family: Arial, sans-serif; 
            background-color: #ffffff; 
            padding: 20px; 
        } 
        
        .card-container { 
            display: grid;
            grid-template-columns: repeat(5, 1fr); 
            gap: 20px; 
        } 
        
        .card { 
            border: 2px solid #4caf50; 
            padding: 15px; 
            background-color: #c8e6c9; 
            text-align: center; 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
            align-items: center;
            word-break: break-word; 
            overflow-wrap: anywhere;
        } 
        
        .img-container {
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            margin: 10px 0;
        }
        
        .img-fix { 
            max-width: 100%; 
            max-height: 100%; 
            object-fit: contain; 
        } 
        
        .card h3, .card p {
            margin: 0;
            width: 100%;
        }
    </style> 
</head> 
<body> 
    <div class="card-container"> 
        <div class="card"> 
            <h3>Батарея</h3> 
            <div class="img-container">
                <img class="img-fix" src="img/batareya.png" alt="Батарея"> 
            </div>
            <p>Настенная белая батарея</p> 
        </div> 
        <div class="card"> 
            <h3>Лампочка</h3> 
            <div class="img-container">
                <img class="img-fix" src="img/lamp.png" alt="Лампочка"> 
            </div>
            <p>Энергосберегающая лампочка</p> 
        </div> 
        <div class="card"> 
            <h3>Окно</h3> 
            <div class="img-container">
                <img class="img-fix" src="img/window.png" alt="Окно"> 
            </div>
            <p>Белая оконная рама</p> 
        </div> 
        <div class="card"> 
            <h3>Кресло</h3> 
            <div class="img-container">
                <img class="img-fix" src="img/seat.png" alt="Кресло"> 
            </div>
            <p>Черное компьютерное кресло</p> 
        </div> 
        <div class="card"> 
            <h3>Телевизор</h3> 
            <div class="img-container">
                <img class="img-fix" src="img/tv.png" alt="Телевизор"> 
            </div>
            <p>Черный телевизор OLED</p> 
        </div> 
    </div> 
</body> 
</html>
